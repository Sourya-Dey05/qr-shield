name: CI

on:
  push:
    branches: ["main", "backend/phase-1-sourya"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Type-check dev tools
        run: npm run typecheck:tools

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
